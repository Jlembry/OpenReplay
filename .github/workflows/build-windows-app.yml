name: Build OpenReplay Windows App

on:
  workflow_dispatch:
    inputs:
      version:
        description: "v1.0.0-beta.2"
        required: true
        default: "v1.0.0-beta.2"
      publish_release:
        description: "Create a GitHub prerelease and attach the portable ZIP"
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Use Python 3.13 x64
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: 'x64'

      # PowerShell does not reliably fail a multi-command step when an early
      # native executable returns a nonzero exit code. Check EACH pip call.
      # Otherwise a failed desktop-requirements install can be masked by a
      # later successful `pip check`, causing a misleading green step.
      - name: Install Python runtime and packaging dependencies
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($required in @('requirements.txt', 'desktop-requirements.txt', 'OpenReplay.spec')) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) {
              throw "Required packaging file missing from the repository: $required"
            }
          }
          Write-Host 'Python interpreter:'
          python -c "import sys; print(sys.executable); print(sys.version)"
          if ($LASTEXITCODE -ne 0) { throw 'Python interpreter check failed' }
          Write-Host 'Upgrade pip:'
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw 'Updating pip failed' }
          Write-Host 'Install application dependencies:'
          python -m pip install --only-binary=:all: -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Application dependency installation failed' }
          Write-Host 'Install Windows desktop packaging dependencies:'
          Get-Content desktop-requirements.txt
          # pywebview depends on proxy_tools, which is published only as a source
          # distribution. Keep --only-binary for runtime/native parser packages
          # above, but permit source distributions for desktop dependencies.
          python -m pip install --prefer-binary -r desktop-requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Desktop dependency installation failed' }
          Write-Host 'Check installed distribution metadata, without importing Windows GUI:'
          python -c "from importlib.metadata import version; print('pywebview',version('pywebview')); print('pyinstaller',version('pyinstaller'))"
          if ($LASTEXITCODE -ne 0) { throw 'pywebview / PyInstaller is missing after installation' }
          Write-Host 'Verify all installed dependency requirements:'
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Dependency consistency check failed' }
          Write-Host 'All runtime and desktop packaging dependencies installed.'

      # Deliberately separate checks. The previous combined step went silent for
      # 44 minutes, making it impossible to tell compilation from GUI import hangs.
      - name: Validate Python syntax
        timeout-minutes: 2
        run: |
          Write-Host 'Compiling Python modules...'
          python -m py_compile desktop.py server.py worker.py security.py parser.py
          if ($LASTEXITCODE -ne 0) { throw 'Python source compilation failed' }
          Write-Host 'Python syntax OK.'

      # These checks isolate dependency failures before PyInstaller runs.
      # Each package starts in a separate interpreter and gets a hard deadline.
      - name: Diagnose Python package imports
        timeout-minutes: 3
        run: |
          foreach ($module in @('fastapi','pandas','numpy','demoparser2')) {
            Write-Host "Probing $module ..."
            python ci/run_checked.py --timeout 20 -- python -u -c "import importlib; importlib.import_module('$module'); print('$module import OK', flush=True)"
            if ($LASTEXITCODE -ne 0) { throw "Import of $module failed/hung. Check installed version and Python compatibility." }
          }

      # Read the installed distribution metadata, not the pywebview module:
      # importing/finding the GUI runtime can block on a headless Windows runner.
      - name: Check pywebview installation without importing GUI
        timeout-minutes: 1
        run: |
          Write-Host 'Reading installed pywebview version from package metadata...'
          python ci/run_checked.py --timeout 15 -- python -u -c "from importlib.metadata import version; print('pywebview ' + version('pywebview'), flush=True)"
          if ($LASTEXITCODE -ne 0) { throw 'pywebview distribution metadata check failed' }

      - name: Headless application self-test
        timeout-minutes: 2
        run: |
          Write-Host 'Checking application imports and static assets (no GUI)...'
          python ci/run_checked.py --timeout 55 -- python -u desktop.py --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Headless application self-test failed or timed out; see last logged import and stack trace above.' }
          Write-Host 'Application self-test OK.'

      - name: Build the portable app
        timeout-minutes: 25
        run: |
          Write-Host 'Building PyInstaller portable app...'
          python -m PyInstaller --clean --noconfirm OpenReplay.spec
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller build failed' }
          Write-Host 'PyInstaller build complete.'

      - name: Smoke-test bundled executable
        timeout-minutes: 3
        run: |
          Write-Host 'Checking frozen executable and bundled static assets...'
          # A windowed PyInstaller EXE has no stdout/stderr. Direct its self-test
          # to a log file, print that file, and NEVER show modal error dialogs.
          $env:OPENREPLAY_SELF_TEST_LOG = Join-Path $env:RUNNER_TEMP 'openreplay-frozen-self-test.log'
          if (Test-Path $env:OPENREPLAY_SELF_TEST_LOG) {
            Remove-Item $env:OPENREPLAY_SELF_TEST_LOG -Force
          }
          python ci/run_checked.py --timeout 75 -- .\dist\OpenReplay\OpenReplay.exe --self-test
          $testExitCode = $LASTEXITCODE
          if (Test-Path $env:OPENREPLAY_SELF_TEST_LOG) {
            Write-Host '--- Frozen self-test diagnostic log ---'
            Get-Content $env:OPENREPLAY_SELF_TEST_LOG
            Write-Host '--- End diagnostic log ---'
          } else {
            Write-Host 'No diagnostic log was created by the EXE.'
          }
          if ($testExitCode -ne 0) {
            throw "The packaged EXE failed the self-test (exit $testExitCode). See the diagnostic log above."
          }
          Write-Host 'Frozen executable self-test passed.'

      - name: Check bundled parser child and original demo cleanup
        timeout-minutes: 3
        run: |
          $testDir = Join-Path $env:RUNNER_TEMP 'openreplay-parser-child'
          New-Item -ItemType Directory -Force -Path $testDir | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $testDir 'demo.dem'),[Text.Encoding]::ASCII.GetBytes('PBDEMS2bad'))
          '{"id":"test","status":"parsing","filename":"bad.dem"}' | Set-Content -Path (Join-Path $testDir 'status.json') -Encoding utf8NoBOM
          $env:OPENREPLAY_WORKER_DIAG_LOG = Join-Path $testDir 'worker-diagnostic.log'
          if (Test-Path $env:OPENREPLAY_WORKER_DIAG_LOG) { Remove-Item $env:OPENREPLAY_WORKER_DIAG_LOG -Force }
          # A corrupt demo is expected to become status=error, while the worker
          # must exit cleanly and remove the original untrusted input file.
          python ci/run_checked.py --timeout 90 -- .\dist\OpenReplay\OpenReplay.exe --worker-single $testDir
          $workerExitCode = $LASTEXITCODE
          if (Test-Path $env:OPENREPLAY_WORKER_DIAG_LOG) {
            Write-Host '--- Frozen parser child diagnostics ---'
            Get-Content $env:OPENREPLAY_WORKER_DIAG_LOG
          } else {
            Write-Host 'No frozen parser child diagnostics were created.'
          }
          if (Test-Path (Join-Path $testDir 'status.json')) {
            Write-Host '--- Parser job result ---'
            Get-Content (Join-Path $testDir 'status.json')
          }
          if ($workerExitCode -ne 0) { throw "Bundled worker crashed or timed out (exit $workerExitCode)" }
          if (Test-Path (Join-Path $testDir 'demo.dem')) { throw 'Worker did not delete the malformed input' }
          $status = Get-Content (Join-Path $testDir 'status.json') -Raw | ConvertFrom-Json
          if ($status.status -ne 'error') { throw "Expected status=error for malformed input, got $($status.status)" }
          Write-Host 'Bundled worker rejected malformed demo, set status=error, and deleted the original.'

      - name: Include tester documentation
        run: |
          Copy-Item -Path 'LICENSE', 'BUILD_WINDOWS_APP.md' -Destination 'dist\OpenReplay'
          python -m pip freeze | Out-File -FilePath 'dist\OpenReplay\BUNDLED_DEPENDENCIES.txt' -Encoding utf8

      - name: Package ZIP and SHA256 checksum
        env:
          RELEASE_LABEL: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $label = $env:RELEASE_LABEL
          if (-not $label -or $label -eq 'main') { $label = 'testing' }
          $label = $label -replace '[^0-9A-Za-z_.-]','-'
          $archive = "OpenReplay-Windows-x64-$label.zip"
          Compress-Archive -Path 'dist\OpenReplay' -DestinationPath (Join-Path 'release' $archive) -CompressionLevel Optimal
          $sum = (Get-FileHash (Join-Path 'release' $archive) -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sum  $archive" | Set-Content 'release\SHA256SUMS.txt' -Encoding ascii
          Write-Host "Created $archive with SHA-256 $sum"

      - name: Upload downloadable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenReplay-Windows-x64
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish prerelease if requested
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_LABEL: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          $tag = $env:RELEASE_LABEL
          if (-not $tag.StartsWith('v')) { throw 'Release version must start with v' }
          $assets = Get-ChildItem -Path release -File | ForEach-Object { $_.FullName }
          gh release create $tag $assets --title "OpenReplay $tag" --prerelease --notes "Portable Windows x64 beta. Extract the ZIP and launch OpenReplay.exe. No Python installation required. Microsoft Edge WebView2 Runtime is needed for the dedicated desktop window."
