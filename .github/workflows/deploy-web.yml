name: OpenReplay Web Candidate Build
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy candidate to GitHub Pages (ONLY after real demo parity testing)"
        required: true
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: openreplay-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch official browser WebAssembly build
        shell: bash
        run: |
          set -euo pipefail
          # The Python and native Node 0.42.0 packages CANNOT run on GitHub Pages.
          # This is the author's separate browser WASM example, not an npm dependency.
          git clone --depth 1 https://github.com/LaihoE/demoparser-wasm-demo.git "$RUNNER_TEMP/openreplay-upstream-wasm"
          test -s "$RUNNER_TEMP/openreplay-upstream-wasm/pkg/demoparser2.js"
          test -s "$RUNNER_TEMP/openreplay-upstream-wasm/pkg/demoparser2_bg.wasm"
          mkdir -p web/vendor
          cp "$RUNNER_TEMP/openreplay-upstream-wasm/pkg/demoparser2.js" web/vendor/
          cp "$RUNNER_TEMP/openreplay-upstream-wasm/pkg/demoparser2_bg.wasm" web/vendor/
          git -C "$RUNNER_TEMP/openreplay-upstream-wasm" rev-parse HEAD > web/vendor/UPSTREAM_COMMIT.txt
          curl --fail --location --silent --show-error https://raw.githubusercontent.com/LaihoE/demoparser/main/LICENSE -o web/vendor/LICENSE-demoparser.txt
          echo "Upstream commit: $(cat web/vendor/UPSTREAM_COMMIT.txt)"
          sha256sum web/vendor/demoparser2.js web/vendor/demoparser2_bg.wasm
      - name: Run adapter unit tests
        working-directory: web
        run: npm test
      - name: Build browser-only candidate
        working-directory: web
        run: npm run build
      - name: Upload candidate to workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenReplay-Web-Candidate
          path: web/dist
          retention-days: 7
      - if: ${{ inputs.deploy == true }}
        uses: actions/configure-pages@v5
      - if: ${{ inputs.deploy == true }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist
  deploy:
    if: ${{ inputs.deploy == true }}
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
