name: OpenReplay Web Candidate Build

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to GitHub Pages (first verify real .dem locally)"
        required: true
        type: boolean
        default: false
  schedule:
    # Daily (UTC): pick up map changes without committing images to Git.
    - cron: '27 9 * * *'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: openreplay-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out OpenReplay
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Rust WASM build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler
          rustup default stable
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --version 0.13.1 --locked
      - name: Compile parser from current Rust source
        shell: bash
        run: |
          set -euo pipefail
          # DO NOT use demoparser-wasm-demo/pkg here: its old binary cannot
          # necessarily decode modern Source 2 entity streams.
          git clone --depth 1 https://github.com/LaihoE/demoparser.git "$RUNNER_TEMP/openreplay-parser-source"
          # TEMPORARY: expose the original Rust panic to the browser console.
          # This adds only diagnostics; it does NOT change demo parsing logic.
          cat >> "$RUNNER_TEMP/openreplay-parser-source/src/wasm/src/lib.rs" <<'OPENREPLAY_RUST'
          
          #[wasm_bindgen::prelude::wasm_bindgen]
          extern "C" {
              #[wasm_bindgen::prelude::wasm_bindgen(js_namespace = console, js_name = error)]
              fn openreplay_wasm_panic_console_error(message: &str);
          }
          
          #[wasm_bindgen::prelude::wasm_bindgen(js_name = installOpenReplayPanicHook)]
          pub fn openreplay_install_panic_hook() {
              std::panic::set_hook(Box::new(|info| {
                  openreplay_wasm_panic_console_error(&format!("[OpenReplay Rust panic] {info}"));
              }));
          }
          OPENREPLAY_RUST
          # Upstream currently calls Rust std::time::Instant::now() during parsing.
          # That traps on wasm32-unknown-unknown. Use web-time, whose browser
          # implementation uses performance.now(). Keep all other parser behavior.
          python3 - <<'OPENREPLAY_CLOCK_FIX'
          from pathlib import Path
          import os
          root = Path(os.environ['RUNNER_TEMP']) / 'openreplay-parser-source' / 'src' / 'parser'
          manifest = root / 'Cargo.toml'
          s = manifest.read_text()
          if '[dependencies]' not in s:
              raise SystemExit('Unexpected upstream parser Cargo.toml: missing [dependencies]')
          if 'web-time' not in s:
              s = s.replace('[dependencies]', '[dependencies]\nweb-time = "=1.1.0"', 1)
              manifest.write_text(s)
          changed = []
          instant_total = 0
          system_total = 0
          for path in (root / 'src').rglob('*.rs'):
              before = path.read_text()
              ni = before.count('std::time::Instant')
              ns = before.count('std::time::SystemTime')
              if ni or ns:
                  after = before.replace('std::time::Instant', 'web_time::Instant')
                  after = after.replace('std::time::SystemTime', 'web_time::SystemTime')
                  path.write_text(after)
                  instant_total += ni
                  system_total += ns
                  changed.append(f'{path.relative_to(root)}: Instant={ni}, SystemTime={ns}')
          if instant_total < 2:
              raise SystemExit('Upstream changed: fewer than two fully qualified Rust Instant references. Review patch before deploying.')
          print('[OpenReplay] Patched WASM clock usages:')
          print('\n'.join(changed))
          print(f'[OpenReplay] Total Instant={instant_total}, SystemTime={system_total}')
          OPENREPLAY_CLOCK_FIX
          mkdir -p web/vendor
          (
            cd "$RUNNER_TEMP/openreplay-parser-source/src/wasm"
            wasm-pack build --release --target no-modules \
              --out-dir "$GITHUB_WORKSPACE/web/vendor" \
              --out-name demoparser2
          )
          test -s web/vendor/demoparser2.js
          test -s web/vendor/demoparser2_bg.wasm
          grep -q 'installOpenReplayPanicHook' web/vendor/demoparser2.js
          git -C "$RUNNER_TEMP/openreplay-parser-source" rev-parse HEAD > web/vendor/UPSTREAM_COMMIT.txt
          cp "$RUNNER_TEMP/openreplay-parser-source/LICENSE" web/vendor/LICENSE-demoparser.txt
          echo "Compiled parser commit: $(cat web/vendor/UPSTREAM_COMMIT.txt)"
          sha256sum web/vendor/demoparser2.js web/vendor/demoparser2_bg.wasm
      - name: Verify adapter regression tests
        working-directory: web
        run: npm test
      - name: Verify worker and adapter JavaScript syntax
        run: |
          node --check web/public/demo-worker.js
          node --check web/public/replay-adapter.js
      - name: Build browser-only candidate
        working-directory: web
        run: npm run build
      - name: Download and validate current CS2 radar maps
        # Maps are created ONLY in web/dist/maps; they never go into the Git repo.
        run: python3 web/scripts/sync_maps.py --output web/dist/maps
      - name: Check core radar assets before publishing
        shell: bash
        run: |
          set -euo pipefail
          for map in de_anubis de_mirage de_nuke; do
            test -s "web/dist/maps/$map.json"
            test -s "web/dist/maps/$map.png"
          done
      - name: Upload test candidate
        uses: actions/upload-artifact@v4
        with:
          name: OpenReplay-Web-Candidate
          path: web/dist
          retention-days: 7
      - name: Configure GitHub Pages (explicit opt-in only)
        if: ${{ github.event_name == 'schedule' || inputs.deploy == true }}
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact (explicit opt-in only)
        if: ${{ github.event_name == 'schedule' || inputs.deploy == true }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    if: ${{ github.event_name == 'schedule' || inputs.deploy == true }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
